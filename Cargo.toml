[package]
name = "ina23x"
version = "0.1.0"
edition = "2024"
authors = ["Raveem Gouda"]
readme = "README.md"
keywords = [
    "ina238",
    "ina239",
    "embedded-hal",
    "power-monitor",
    "i2c",
    "spi",
    "ti",
]
categories = [
    "embedded",
    "hardware-support",
    "no-std",
]
license = "MIT OR Apache-2.0"

[dependencies]
embedded-hal = "1.0"

[dev-dependencies]
embedded-hal-mock = "0.11"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
codegen-units = 1